name: dev-mysql

services:
  mysql:
    # 使用本地已拉取的 LTS 镜像（当前即 8.4 LTS）
    image: mysql:lts
    container_name: dev-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_USER: ${MYSQL_USER:-dev}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dev123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dev}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      # 数据使用命名卷，不映射到主机目录
      - mysql_data:/var/lib/mysql
      - ./conf/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
