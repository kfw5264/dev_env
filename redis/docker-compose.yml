name: dev-redis

services:
  redis:
    # 使用本地已拉取的镜像
    image: redis:7.4.11
    container_name: dev-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD:-redis123}"]
    ports:
      - "6379:6379"
    volumes:
      # 数据使用命名卷，不映射到主机目录
      - redis_data:/data
      - ./conf/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  redis_data:
